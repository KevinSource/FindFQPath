[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "findfqpath"
version = "1.0.6"
description = "Find the latest installed copy of an executable (e.g. opera.exe) even when updates move it to a new folder, and cache the path."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "KevinSource", email = "kdoglio@gmail.com" }]
keywords = ["executable", "path", "find", "locate", "file-search", "selenium", "webdriver", "binary_location", "cache"]
dependencies = ["platformdirs>=2.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/KevinSource/FindFQPath"
Source = "https://github.com/KevinSource/FindFQPath"
Issues = "https://github.com/KevinSource/FindFQPath/issues"

[tool.setuptools]
py-modules = ["findfqpath"]
